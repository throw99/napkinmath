name: Upstream sync

# Merge upstream/main into the tauri branch, prove the desktop build still works,
# then push. A merge conflict or a failed build stops the job before the push.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/LucasAIBuilder/napkinmath.git
  TARGET_BRANCH: tauri

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows.
          # Set a SYNC_TOKEN secret (fine-grained PAT: contents + workflows write)
          # if upstream changes its workflows.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge upstream/main
        id: merge
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge --no-edit upstream/main \
            || { git merge --abort; echo "::error::Merge conflict with upstream/main. Resolve it locally."; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install system libraries
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.merge.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.merge.outputs.changed == 'true'
        with:
          workspaces: src-tauri -> target

      - name: Build the desktop app
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci
          npx --yes @tauri-apps/cli@2.11.4 build --bundles deb

      - name: Push the merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:$TARGET_BRANCH"
